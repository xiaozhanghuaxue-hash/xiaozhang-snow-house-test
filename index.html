  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%23145acb' d='M4 48 28 12l8 12 6-9 18 33H4Z'/%3E%3Cpath fill='white' d='m20 34 8-12 5 8 3-5 6 10-8-5-5 8-4-7-5 3Z'/%3E%3C/svg%3E">
  <style>
    :root{--blue:#0754c9;--navy:#0b356f;--soft:#7d98c3;--line:#dbe7f7;--ice:#edf5ff;--card:rgba(255,255,255,.91);--shadow:0 14px 38px rgba(45,91,151,.13);--bottom-safe:max(env(safe-area-inset-bottom,0px),44px)}
    *{box-sizing:border-box}html{min-height:100%;background:#eaf2fc;-webkit-text-size-adjust:100%}body{margin:0;min-height:100vh;min-height:100svh;min-height:100dvh;color:var(--navy);font:16px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;background:#eaf2fc;overflow-x:hidden}button,input,textarea,select{font:inherit}.shell{max-width:540px;min-height:100vh;min-height:100svh;min-height:100dvh;margin:auto;background:linear-gradient(180deg,#fbfdff 0,#eef5ff 46%,#f8fbff 100%);position:relative;overflow-x:hidden;overflow-y:visible;padding-bottom:calc(118px + var(--bottom-safe))}.mountains{height:238px;background:url('./assets/snow-mountain-header.png') center bottom/cover no-repeat;position:absolute;inset:0 0 auto;opacity:.92}.content{position:relative;padding:52px 22px 20px}.brand{display:flex;align-items:center;gap:12px;font-family:STSong,"Songti SC",serif;font-size:22px;font-weight:700;color:#0b3b82}.mark{width:40px;height:34px;display:grid;place-items:center}.mark svg{width:40px;height:34px}.date{margin-top:62px;color:#7895bf;font-size:16px}.headline{font:700 34px/1.25 STSong,"Songti SC",serif;margin:12px 0 22px;color:#0a3675}.section-title{display:flex;align-items:center;justify-content:space-between;margin:24px 4px 12px}.section-title h2{font:700 22px STSong,"Songti SC",serif;margin:0}.section-title span{color:#7895bf;font-size:14px}.card{background:var(--card);border:1px solid rgba(205,221,244,.84);border-radius:24px;padding:20px;box-shadow:var(--shadow);backdrop-filter:blur(14px);margin:12px 0}.plan-row,.list-row{display:flex;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid #e6eef9}.plan-row:last-child,.list-row:last-child{border:0}.icon{width:44px;height:44px;border-radius:15px;background:#eef5ff;display:grid;place-items:center;color:#1b67d9;font-size:22px;flex:0 0 auto}.grow{flex:1;min-width:0}.title{font-weight:650;color:#123d7d}.meta{font-size:14px;color:#8098bd;margin-top:2px}.check{width:28px;height:28px;border-radius:50%;border:2px solid #8fa9d0;background:white}.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.quick button{min-width:0;border:0;background:white;border-radius:18px;padding:14px 4px 12px;color:#214d8d;box-shadow:0 8px 24px rgba(62,104,164,.11);border:1px solid #dce8f8}.quick b{display:block;font-size:22px;margin-bottom:5px;color:#1761ce}.quick small{font-size:12px;white-space:nowrap}.tabbar{position:fixed;z-index:20;bottom:0;left:50%;transform:translateX(-50%);width:min(540px,100%);padding:10px max(14px,env(safe-area-inset-right,0px)) calc(10px + var(--bottom-safe));display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,255,255,.95);border-top:1px solid #dce7f6;backdrop-filter:blur(18px)}.tabbar button{border:0;background:none;color:#7e98c0;padding:7px 4px;min-height:44px}.tabbar button.active{color:var(--blue);font-weight:700}.tabbar b{display:block;font-size:20px;line-height:1.1}.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.page-head h1{font:700 30px STSong,"Songti SC",serif;margin:0}.btn{border:1px solid #b9ceed;border-radius:13px;background:white;color:#145bc6;padding:10px 15px}.btn.primary{border:0;color:#fff;background:linear-gradient(135deg,#287be8,#0750cc);box-shadow:0 8px 20px #1d62cf35}.summary{padding:24px;background:linear-gradient(145deg,rgba(255,255,255,.97),rgba(237,246,255,.89));position:relative;overflow:hidden}.summary .label{color:#6e8bb8}.amount{font:700 40px/1.2 Georgia,serif;color:#084dac;margin:8px 0}.stats{display:flex;gap:18px;color:#6f88ad;font-size:14px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;text-align:center}.cal-label{font-size:12px;color:#8199bc}.day{aspect-ratio:1;border:0;background:transparent;border-radius:12px;color:#345b91;position:relative}.day.today{background:#0b5bd5;color:white}.day.has::after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:#58a1ff;left:50%;bottom:3px;transform:translateX(-50%)}.day.today::after{background:white}.filter{display:flex;background:white;border:1px solid #dbe7f7;border-radius:15px;padding:4px}.filter button{flex:1;border:0;background:transparent;padding:8px;border-radius:11px;color:#708bb4}.filter button.on{background:#eaf3ff;color:#0754c9;font-weight:700}.record-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.record-card{border:0;text-align:left;background:white;border-radius:22px;padding:18px;box-shadow:var(--shadow);color:#143e7b;min-height:126px}.record-card b{display:block;font-size:20px;margin:8px 0}.record-card span{font-size:14px;color:#8198ba}.record-card.wide{grid-column:1/-1}.admin-row{display:flex;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid #e6eef9}.admin-row:last-child{border:0}.arrow{color:#78a0d6;font-size:22px}.sheet{position:fixed;z-index:40;inset:0;background:rgba(10,36,73,.22);display:none;align-items:flex-end;justify-content:center}.sheet.show{display:flex}.panel{width:min(540px,100%);max-height:92vh;max-height:92dvh;overflow:auto;overscroll-behavior:contain;scroll-padding-bottom:calc(96px + var(--bottom-safe));background:#f8fbff;border-radius:28px 28px 0 0;padding:24px 22px calc(34px + var(--bottom-safe));box-shadow:0 -18px 50px #173e7930}.panel h2{font:700 26px STSong,"Songti SC",serif;margin:0 0 18px}.field{margin:14px 0}.field label{display:block;font-size:14px;color:#5f7ca8;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;border:1px solid #c9dbf2;border-radius:13px;background:white;padding:12px 13px;color:#143e75;outline:none}.field textarea{min-height:78px;resize:vertical}.actions{display:flex;gap:10px;margin-top:20px}.actions .btn{flex:1}.notice{padding:12px 14px;border-radius:13px;background:#eaf4ff;color:#38689f;font-size:14px}.profit{display:grid;gap:8px;margin-top:14px}.profit div{display:flex;justify-content:space-between}.profit strong{color:#148454}.empty{text-align:center;color:#86a0c4;padding:22px 8px}.hidden{display:none!important}@media(min-width:700px){.shell{margin:24px auto;border-radius:34px;min-height:calc(100vh - 48px);box-shadow:0 30px 80px #355c8f2b}.tabbar{bottom:24px;border-radius:0 0 34px 34px}}
    /* Compact mobile layout: one scroll area per dialog, with no page behind it moving. */
    html{overflow-x:hidden;overscroll-behavior:none}
    body{overscroll-behavior:none}
    html.dialog-open{overflow:hidden}
    body.dialog-open{position:fixed;width:100%;overflow:hidden}
    .shell{padding-bottom:calc(80px + var(--bottom-safe))}
    .content{padding:28px 18px 18px}
    .date{margin-top:36px;font-size:14px}
    .section-title{margin:20px 2px 10px}
    .section-title h2{font-size:20px}
    .card{padding:16px;border-radius:20px}
    .empty{padding:16px 6px}
    .quick{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .quick button{min-height:48px;padding:12px 8px;border-radius:14px;font-size:15px;line-height:1.4;overflow-wrap:anywhere}
    .quick button:last-child{grid-column:1/-1}
    .tabbar{gap:6px;padding-top:8px;padding-bottom:calc(8px + var(--bottom-safe))}
    .tabbar button{font-size:15px;min-width:0;min-height:44px;border-radius:12px}
    .tabbar button.active{background:#eaf3ff}
    .sheet{top:var(--dialog-top,0px);bottom:auto;height:var(--dialog-height,100dvh);padding:12px 12px calc(12px + var(--bottom-safe));align-items:center;overflow:hidden;overscroll-behavior:none}
    .panel{display:flex;flex-direction:column;min-height:0;max-height:100%;max-width:100%;padding:0;border-radius:20px;overflow:hidden;scroll-padding-bottom:0}
    .panel-header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px 8px;flex:none}
    .panel-header h2{font-size:21px;line-height:1.4;margin:0;min-width:0}
    .panel-close{border:0;background:transparent;color:#52749f;min-height:44px;min-width:44px;font-size:14px;flex:none}
    .panel-content{min-height:0;overflow-x:hidden;overflow-y:auto;overscroll-behavior:none;touch-action:pan-y pinch-zoom;padding:0 16px 16px;scroll-padding:12px 0 80px}
    .panel-content>*{max-width:100%;min-width:0}
    .panel form{margin:0;min-width:0}
    .field{margin:10px 0}
    .field label{font-size:14px;margin-bottom:5px}
    .field input,.field select,.field textarea{display:block;min-width:0;max-width:100%;width:100%;font-size:16px;line-height:1.4;padding:9px 10px;border-radius:10px;min-height:44px}
    .field input[type=date],.field input[type=time]{appearance:none;-webkit-appearance:none}
    .field textarea{height:66px;min-height:66px;resize:none}
    .actions{position:sticky;bottom:-16px;z-index:1;margin-top:12px;padding:10px 0 16px;background:#f8fbff}
    .actions .btn{min-width:0;min-height:44px;padding:9px 6px}
    .panel .notice{padding:10px 12px;font-size:13px}
    .panel .card{padding:12px;margin:10px 0}
    @media(max-height:500px){.sheet{padding-top:6px;padding-bottom:8px}.panel-header{padding-top:4px;padding-bottom:4px}}
    .sale-note{margin-top:8px;font-size:14px;color:#52749f;overflow-wrap:anywhere}
    .sale-note summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:#145bc6}
    .sale-note summary::after{content:'＋';margin-left:6px}
    .sale-note[open] summary::after{content:'−'}
    .sale-note div{white-space:pre-wrap;padding:8px 10px;background:#edf5ff;border-radius:10px}
  </style>
</head>
<body>
  <main class="shell"><div class="mountains"></div><div class="content" id="app"></div></main>
  <nav class="tabbar" aria-label="主导航">
    <button data-view="home" class="active">首页</button><button data-view="plan">计划</button><button data-view="records">记录</button><button data-view="admin">后台</button>
  </nav>
  <div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
  <script>
  const key='snow-house-mobile-v2';
  const base={plans:[],sales:[],teach:[],dealers:[],orders:[],other:[],categories:[{name:'雪服',sale:1699,cost:934.45},{name:'雪裤',sale:1499,cost:824.45},{name:'手套',sale:299,cost:164.45}]};
  const data=Object.assign(base,JSON.parse(localStorage.getItem(key)||'{}'));let view='home',filter='all',selectedDate=iso(new Date());
  const app=document.querySelector('#app'),sheet=document.querySelector('#sheet'),panel=document.querySelector('#panel');
  function iso(d){return d.toISOString().slice(0,10)}function save(){localStorage.setItem(key,JSON.stringify(data))}function yen(n){return '¥'+Number(n||0).toLocaleString('zh-CN',{maximumFractionDigits:2})}function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function esc(s=''){return String(s).replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]))}
  function brand(){return `<div class="brand"><span class="mark"><svg viewBox="0 0 64 52" aria-hidden="true"><path fill="#1d6bdc" d="M1 48 27 7l9 14 8-12 19 39-28-21-8 12-7-10Z"/><path fill="#fff" d="m21 28 6-10 6 9 3-4 6 8-8-4-6 9-4-7Z"/></svg></span>小张的雪屋</div>`}
  function todayText(){return new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'})}
  function home(){const today=iso(new Date()),ps=data.plans.filter(x=>x.date===today&&!x.done),ts=data.teach.filter(x=>x.date===today&&x.status!=='done');return `${brand()}<div class="date">${todayText()}</div><div class="section-title"><h2>今天的计划</h2><span>${ps.length+ts.length} 项</span></div><section class="card">${ps.map(x=>planRow(x)).join('')}${ts.map(x=>`<div class="plan-row"><div class="icon">▦</div><div class="grow"><div class="title">确认教学安排</div><div class="meta">${x.start||'未填时间'} · ${x.hours||0}小时 · ${yen(x.fee)}</div></div><button class="check" onclick="finishTeach('${x.id}')" aria-label="完成教学"></button></div>`).join('')||(!ps.length?'<div class="empty">今天没有计划</div>':'')}</section><div class="section-title"><h2>快速记录</h2></div><div class="quick"><button onclick="openPlan()">工作计划</button><button onclick="openSale()">商品销售</button><button onclick="openTeach()">教学服务</button><button onclick="openOrder()">经销商</button><button onclick="openOther()">其他</button></div>`}
  function planRow(x){return `<div class="plan-row"><div class="icon">▤</div><div class="grow"><div class="title">${esc(x.name)}</div><div class="meta">${x.time||'未设置时间'} · ${x.done?'已完成':'待完成'}</div></div><button class="check" onclick="finishPlan('${x.id}')" aria-label="${x.done?'恢复未完成':'标记完成'}" style="${x.done?'background:#1762d5;border-color:#1762d5':''}"></button></div>`}
  function calendar(){const d=new Date(selectedDate+'T00:00:00'),y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();let cells='<div class="cal-label">日</div><div class="cal-label">一</div><div class="cal-label">二</div><div class="cal-label">三</div><div class="cal-label">四</div><div class="cal-label">五</div><div class="cal-label">六</div>';for(let i=0;i<first;i++)cells+='<span></span>';for(let n=1;n<=days;n++){const v=`${y}-${String(m+1).padStart(2,'0')}-${String(n).padStart(2,'0')}`,has=data.plans.some(x=>x.date===v)||data.teach.some(x=>x.date===v);cells+=`<button class="day ${v===iso(new Date())?'today':''} ${has?'has':''}" onclick="selectedDate='${v}';render()">${n}</button>`}return `<div class="card"><div class="section-title" style="margin-top:0"><h2>${y}年${m+1}月</h2><span>${selectedDate.slice(5).replace('-','月')}日</span></div><div class="calendar">${cells}</div></div>`}
  function plans(){let list=[...data.plans.filter(x=>x.date===selectedDate).map(x=>({...x,type:'plan'})),...data.teach.filter(x=>x.date===selectedDate).map(x=>({...x,name:'教学安排',done:x.status==='done',type:'teach'}))];if(filter==='todo')list=list.filter(x=>!x.done);if(filter==='done')list=list.filter(x=>x.done);return `${brand()}<div class="date">${todayText()}</div><div class="page-head"><h1>工作计划</h1><button class="btn primary" onclick="openPlan()">＋ 新增</button></div>${calendar()}<div class="filter"><button class="${filter==='all'?'on':''}" onclick="filter='all';render()">全部</button><button class="${filter==='todo'?'on':''}" onclick="filter='todo';render()">未完成</button><button class="${filter==='done'?'on':''}" onclick="filter='done';render()">已完成</button></div><section class="card">${list.map(x=>x.type==='teach'?`<div class="list-row"><div class="icon">▦</div><div class="grow"><div class="title">教学安排</div><div class="meta">${x.start||'未填时间'} · ${x.hours||0}小时 · ${yen(x.fee)}</div></div><span class="arrow">›</span></div>`:planRow(x)).join('')||'<div class="empty">当天没有计划</div>'}</section>`}
  function saleTotals(){return data.sales.reduce((a,s)=>{a.receipt+=+s.receipt||0;a.cost+=s.items.reduce((b,i)=>b+(+i.cost||0)*(+i.qty||0),0);a.ship+=+s.ship||0;a.count++;a.qty+=s.items.reduce((b,i)=>b+(+i.qty||0),0);return a},{receipt:0,cost:0,ship:0,count:0,qty:0})}
  function records(){const s=saleTotals(),teachIncome=data.teach.filter(x=>x.status==='done').reduce((a,x)=>a+(+x.fee||0),0),orderTotal=data.orders.reduce((a,x)=>a+(+x.amount||0),0),otherTotal=data.other.reduce((a,x)=>a+(+x.amount||0),0);return `${brand()}<div class="date">${todayText()}</div><div class="page-head"><h1>记录</h1></div><div class="record-grid"><button class="record-card wide" onclick="showSales()"><span>商品销售 · 当前全部</span><b>${yen(s.receipt)}</b><span>${s.count} 笔交易 · ${s.qty} 件商品 · 查看利润 ›</span></button><button class="record-card" onclick="showTeaching()"><span>教学服务</span><b>${yen(teachIncome)}</b><span>已完成 ${data.teach.filter(x=>x.status==='done').length} 次</span></button><button class="record-card" onclick="showDealers()"><span>经销商</span><b>${yen(orderTotal)}</b><span>${data.dealers.length} 家已记录</span></button><button class="record-card wide" onclick="showOther()"><span>其他收入</span><b>${yen(otherTotal)}</b><span>${data.other.length} 笔记录</span></button></div>`}
  function admin(){return `${brand()}<div class="date">${todayText()}</div><div class="page-head"><h1>后台</h1></div><section class="card"><div class="admin-row" onclick="showCategories()"><div class="grow"><div class="title">商品品类</div><div class="meta">名称、销售单价与结算价格</div></div><span class="arrow">›</span></div><div class="admin-row" onclick="showDealers()"><div class="grow"><div class="title">经销商资料</div><div class="meta">名称与所在地</div></div><span class="arrow">›</span></div><div class="admin-row"><div class="grow"><div class="title">数据导出</div><div class="meta">后续测试完整导出格式</div></div><span class="arrow">›</span></div></section><section class="card"><div class="admin-row"><div class="grow"><div class="title">账户与安全</div><div class="meta">正式登录功能最后处理</div></div><span class="arrow">›</span></div></section>`}
  function render(){app.innerHTML=view==='home'?home():view==='plan'?plans():view==='records'?records():admin();document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('active',b.dataset.view===view))}
  document.querySelectorAll('.tabbar button').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});
  let pageScroll=0,sheetReturnFocus=null;
  function fitSheet(){const viewport=window.visualViewport;sheet.style.setProperty('--dialog-height',`${viewport?viewport.height:window.innerHeight}px`);sheet.style.setProperty('--dialog-top',`${viewport?viewport.offsetTop:0}px`)}
  function openSheet(html){
    if(!sheet.classList.contains('show')){pageScroll=window.scrollY;sheetReturnFocus=document.activeElement;document.documentElement.classList.add('dialog-open');document.body.classList.add('dialog-open');document.body.style.top=`-${pageScroll}px`}
    const content=document.createElement('div');content.className='panel-content';content.innerHTML=html;
    const title=content.querySelector('h2');title.id='dialog-title';
    const header=document.createElement('div');header.className='panel-header';header.append(title);
    const close=document.createElement('button');close.type='button';close.className='panel-close';close.textContent='关闭';close.onclick=closeSheet;header.append(close);
    panel.replaceChildren(header,content);panel.setAttribute('role','dialog');panel.setAttribute('aria-modal','true');panel.setAttribute('aria-labelledby','dialog-title');
    sheet.classList.add('show');document.querySelector('.shell').inert=true;document.querySelector('.tabbar').inert=true;fitSheet();close.focus({preventScroll:true});
  }
  function closeSheet(){document.activeElement?.blur();sheet.classList.remove('show');document.documentElement.classList.remove('dialog-open');document.body.classList.remove('dialog-open');document.body.style.top='';document.querySelector('.shell').inert=false;document.querySelector('.tabbar').inert=false;window.scrollTo(0,pageScroll);sheetReturnFocus?.focus({preventScroll:true})}
  sheet.onclick=e=>{if(e.target===sheet)closeSheet()};
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet.classList.contains('show'))closeSheet()});
  window.visualViewport?.addEventListener('resize',fitSheet);window.visualViewport?.addEventListener('scroll',fitSheet);window.addEventListener('resize',fitSheet);
  function formActions(label){return `<div class="actions"><button type="button" class="btn" onclick="closeSheet()">取消</button><button class="btn primary">${label}</button></div>`}
  function openPlan(){openSheet(`<h2>新增工作计划</h2><form onsubmit="addPlan(event)"><div class="field"><label>计划日期</label><input name="date" type="date" value="${iso(new Date())}" required></div><div class="field"><label>计划时间（可选）</label><input name="time" type="time"></div><div class="field"><label>工作项目</label><input name="name" placeholder="输入临时工作安排" required></div><div class="field"><label>备注（可选）</label><textarea name="note"></textarea></div>${formActions('保存计划')}</form>`)}
  function openSale(){openSheet(`<h2>新增商品销售</h2><div class="notice">一笔交易可记录多件相同或不同商品；邮费整笔只扣一次。</div><form onsubmit="addSale(event)"><div class="field"><label>交易日期</label><input name="date" type="date" value="${iso(new Date())}" required></div><div class="field"><label>商品品类</label><select name="cat">${data.categories.map((x,i)=>`<option value="${i}">${esc(x.name)} · 结算 ${yen(x.cost)}</option>`).join('')}</select></div><div class="field"><label>颜色</label><input name="color" required></div><div class="field"><label>尺码</label><input name="size" required></div><div class="field"><label>数量</label><input name="qty" type="number" min="1" value="1" required></div><div class="field"><label>整笔实际收款</label><input name="receipt" type="number" min="0.01" step="0.01" required></div><div class="field"><label>邮费（可选）</label><input name="ship" type="number" min="0" step="0.01"></div><div class="field"><label for="sale-note">备注（可选）</label><textarea id="sale-note" name="note" placeholder="例如：谁购买的、谁帮忙销售的，或其他补充说明"></textarea></div><div class="field"><label>发货原文（可选，日常列表隐藏）</label><textarea name="shipping"></textarea></div>${formActions('保存交易')}</form>`)}
  function openTeach(){openSheet(`<h2>新增教学安排</h2><form onsubmit="addTeach(event)"><div class="field"><label>教学日期</label><input name="date" type="date" value="${iso(new Date())}" required></div><div class="field"><label>开始时间</label><input name="start" type="time" required></div><div class="field"><label>教学时长</label><select name="hours"><option>0.5</option><option>1</option><option selected>1.5</option><option>2</option><option>2.5</option><option>3</option><option>3.5</option><option>4</option></select></div><div class="field"><label>本次小时费用</label><input name="rate" type="number" min="0" step="1" required></div><div class="field"><label>备注（地点、学员等）</label><textarea name="note"></textarea></div>${formActions('保存教学安排')}</form>`)}
  function openOrder(){openSheet(`<h2>新增经销商订货</h2><form onsubmit="addOrder(event)"><div class="field"><label>经销商</label><select name="dealer"><option value="new">＋ 新经销商</option>${data.dealers.map(x=>`<option value="${x.id}">${esc(x.name)} · ${esc(x.location)}</option>`).join('')}</select></div><div class="field"><label>新经销商名称（选择新经销商时填写）</label><input name="newName"></div><div class="field"><label>所在地</label><input name="location"></div><div class="field"><label>本次订货金额</label><input name="amount" type="number" min="0" step="1" required></div><div class="field"><label>备注（可选）</label><textarea name="note"></textarea></div>${formActions('保存订货')}</form>`)}
  function openOther(){openSheet(`<h2>新增其他收入</h2><form onsubmit="addOther(event)"><div class="field"><label>日期</label><input name="date" type="date" value="${iso(new Date())}" required></div><div class="field"><label>项目</label><input name="project" required></div><div class="field"><label>实际收款（可选）</label><input name="amount" type="number" min="0" step="1"></div><div class="field"><label>备注（可选）</label><textarea name="note"></textarea></div>${formActions('保存记录')}</form>`)}
  function fields(e){return Object.fromEntries(new FormData(e.target))}function addPlan(e){e.preventDefault();data.plans.push({...fields(e),id:id(),done:false});save();closeSheet();render()}function addSale(e){e.preventDefault();const f=fields(e),c=data.categories[+f.cat];data.sales.push({id:id(),date:f.date,receipt:+f.receipt,ship:+f.ship||0,shipping:f.shipping,note:(f.note||'').trim(),items:[{name:c.name,color:f.color,size:f.size,qty:+f.qty,cost:+c.cost}]});save();closeSheet();render()}function addTeach(e){e.preventDefault();const f=fields(e);data.teach.push({...f,id:id(),hours:+f.hours,rate:+f.rate,fee:+f.hours*+f.rate,status:'planned'});save();closeSheet();render()}function addOrder(e){e.preventDefault();const f=fields(e);let dealer=f.dealer;if(dealer==='new'){const d={id:id(),name:f.newName||'未命名经销商',location:f.location||'未填写'};data.dealers.push(d);dealer=d.id}data.orders.push({id:id(),dealer,date:iso(new Date()),amount:+f.amount,note:f.note});save();closeSheet();render()}function addOther(e){e.preventDefault();const f=fields(e);data.other.push({...f,id:id(),amount:+f.amount||0});save();closeSheet();render()}function finishPlan(i){const x=data.plans.find(x=>x.id===i);x.done=!x.done;save();render()}function finishTeach(i){const x=data.teach.find(x=>x.id===i);x.status='done';save();render()}
  function showSales(){const t=saleTotals(),p=t.receipt-t.cost-t.ship;openSheet(`<h2>商品销售</h2><div class="summary"><div class="label">当前全部实收</div><div class="amount">${yen(t.receipt)}</div><div class="stats"><span>${t.count} 笔交易</span><span>${t.qty} 件商品</span></div></div><div class="card profit"><div><span>结算成本</span><b>${yen(t.cost)}</b></div>${t.ship?`<div><span>邮费支出</span><b>${yen(t.ship)}</b></div>`:''}<div><span>商品销售利润</span><strong>${yen(p)}</strong></div></div><section class="card">${[...data.sales].reverse().map(s=>`<div class="list-row"><div class="grow"><div class="title">${s.items.map(i=>`${esc(i.name)} ${esc(i.color)} ${esc(i.size)} ×${i.qty}`).join('、')}</div><div class="meta">${s.date} · 实收 ${yen(s.receipt)}</div>${s.note?`<details class="sale-note"><summary>查看备注</summary><div>${esc(s.note)}</div></details>`:''} </div></div>`).join('')||'<div class="empty">暂无销售记录</div>'}</section><button class="btn primary" onclick="openSale()">新增销售记录</button>`)}
  function showTeaching(){openSheet(`<h2>教学服务</h2><section class="card">${data.teach.map(x=>`<div class="list-row"><div class="grow"><div class="title">${x.date} · ${x.start}</div><div class="meta">${x.hours}小时 · ${yen(x.fee)} · ${x.status==='done'?'已完成':'教学安排'}</div></div></div>`).join('')||'<div class="empty">暂无教学安排</div>'}</section><button class="btn primary" onclick="openTeach()">新增教学安排</button>`)}
  function showDealers(){openSheet(`<h2>经销商</h2><section class="card">${data.dealers.map(d=>{const os=data.orders.filter(o=>o.dealer===d.id),sum=os.reduce((a,o)=>a+o.amount,0);return `<div class="list-row"><div class="icon">♧</div><div class="grow"><div class="title">${esc(d.name)}</div><div class="meta">${esc(d.location)} · ${os.length} 次订货</div></div><b>${yen(sum)}</b></div>`}).join('')||'<div class="empty">暂无经销商</div>'}</section><button class="btn primary" onclick="openOrder()">新增订货记录</button>`)}
  function showOther(){openSheet(`<h2>其他收入</h2><section class="card">${data.other.map(x=>`<div class="list-row"><div class="grow"><div class="title">${esc(x.project)}</div><div class="meta">${x.date}</div></div><b>${yen(x.amount)}</b></div>`).join('')||'<div class="empty">暂无其他收入</div>'}</section><button class="btn primary" onclick="openOther()">新增记录</button>`)}
  function showCategories(){openSheet(`<h2>商品品类</h2><div class="notice">修改或删除只影响以后选品，历史交易保留当时的名称和结算价。</div><section class="card">${data.categories.map((x,i)=>`<div class="list-row"><div class="grow"><div class="title">${esc(x.name)}</div><div class="meta">销售 ${yen(x.sale)} · 结算 ${yen(x.cost)}</div></div><button class="btn" onclick="removeCategory(${i})">删除</button></div>`).join('')}</section><form onsubmit="addCategory(event)"><div class="field"><label>新商品品类</label><input name="name" required placeholder="例如：羽绒服"></div><div class="field"><label>销售单价</label><input name="sale" type="number" min="0" step="0.01" required></div><div class="field"><label>结算价格</label><input name="cost" type="number" min="0" step="0.01" required></div>${formActions('添加品类')}</form>`)}function addCategory(e){e.preventDefault();const f=fields(e);data.categories.push({name:f.name,sale:+f.sale,cost:+f.cost});save();showCategories()}function removeCategory(i){data.categories.splice(i,1);save();showCategories()}
  render();
  </script>
</body>
</html>
